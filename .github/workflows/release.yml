name: release

# Publishes a GitHub release for a version tag, with the changie notes and helicopter.json attached.
# Cut a release: run `changie batch auto && changie merge` in a release pull request, merge it,
# then tag the merge commit (`git tag -s vX.Y.Z && git push origin vX.Y.Z`). Not shipped to adopters.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build helicopter.json
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release_manifest.py "$TAG" --repo "$REPOSITORY" > helicopter.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" helicopter.json --verify-tag --title "$TAG" --notes-file ".changes/$TAG.md"
