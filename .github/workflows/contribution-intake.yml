name: contribution-intake

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Unset repository variables disable the exemption. A positive immutable user
# ID can authorize that sole maintainer in a user- or organization-owned repo.
env:
  HELICOPTER_SOLO_MAINTAINER_MODE: ${{ vars.HELICOPTER_SOLO_MAINTAINER_MODE == 'true' && 'true' || 'false' }}
  HELICOPTER_SOLO_MAINTAINER_ID: ${{ vars.HELICOPTER_SOLO_MAINTAINER_ID || '0' }}

concurrency:
  group: contribution-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out validator from protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-base
          persist-credentials: false
          sparse-checkout: scripts
          fetch-depth: 1

      - name: Validate pull request metadata
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: >-
          python3 trusted-base/scripts/validate_pr.py "$EVENT_PATH"
          --solo-maintainer-mode "$HELICOPTER_SOLO_MAINTAINER_MODE"
          --solo-maintainer-id "$HELICOPTER_SOLO_MAINTAINER_ID"

      # Security invariant: this privileged event must never check out or execute
      # the pull request head. Project builds/tests belong in a separate
      # pull_request workflow with no secrets and read-only permissions.
