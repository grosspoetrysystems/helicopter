kind: Added
body: 'A companion agent skill, helicopter (npx skills add grosspoetrysystems/helicopter), installs from a verified release or updates an installed copy: unchanged files are replaced, customized ones get a three-way merge, conflicts are left for review, and the release notes'' Action required steps become a task list in one pull request. It records the release in .github/helicopter/version.json with Helicopter''s license beside it; copies installed before the marker are matched to their release. check_install.py checks both.'
