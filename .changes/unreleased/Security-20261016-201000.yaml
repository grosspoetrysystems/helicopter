kind: Security
body: 'A repository baseline: approval after the latest push in reviewed modes, read-only workflow tokens that can''t approve pull requests, first-time-contributor workflow approval, Dependabot alerts and security updates, secret scanning with push protection, private vulnerability reporting, protected v* release tags, Dependabot for pinned actions with a 7-day cooldown, and wider CODEOWNERS.'
